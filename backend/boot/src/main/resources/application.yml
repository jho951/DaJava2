server:
  port: 8080

spring:
  mail:
    host: ${MAIL_HOST:smtp.example.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER:}
    password: ${MAIL_PASS:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  jackson:
    deserialization:
      fail-on-null-for-primitives: true
  elasticsearch:
    uris: http://localhost:9200
  profiles:
    default: dev
    include: secret
  application:
    name: dajava_server
  datasource:
    url: jdbc:h2:file:./backend/db/db_dev
    username: sa
    password:
    driver-class-name: org.h2.Driver
  cache:
    type: redis
  servlet:
    multipart:
      max-file-size: ${spring.servlet.multipart.max-request-size}
      max-request-size: 10MB
  jpa:
    hibernate:
      ddl-auto: create
      dialect: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        default_batch_fetch_size: 100
        format_sql: true
        highlight_sql: true
        use_sql_comments: true

  data:
    redis:
      host: localhost
      port: 6379
      password: 1234

image:
  path: backend/images/page-capture
